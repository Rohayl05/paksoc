version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: paksoc-postgres
    environment:
      POSTGRES_USER: paksoc
      POSTGRES_PASSWORD: paksoc
      POSTGRES_DB: paksoc
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
